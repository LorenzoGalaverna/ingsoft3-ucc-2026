# CI/CD — construye backend y frontend con sus Dockerfiles del TP2, corre la
# suite de tests con cobertura del TP5, y —desde el TP6— publica las imágenes
# etiquetadas por commit en ghcr.io. Sólo publica en push a main y sólo si los
# tests pasaron (los pasos que publican son los ÚLTIMOS del job: si algo falla
# antes, el job muere y nunca llegan a correr — §3.0 del TP6).
name: CI

on:
  pull_request:
    branches: [main]      # el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # deja constancia post-merge, siembra cache y publica

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Mínimo privilegio: sólo este job publica paquetes; sin este bloque el
    # push a ghcr con GITHUB_TOKEN fallaría con "denied: permission_denied".
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # 1. VERIFICAR — construye hasta la etapa `test` (vitest --coverage).
      #    Si el umbral no llega, este step muere y los que publican no corren.
      - name: Correr tests con coverage (etapa `test`)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          push: false
          tags: habit-tracker-backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # 2. REPORTAR — extrae y publica el reporte de coverage. Con
      #    `if: always()` corre igual si el test falló, para dejar la
      #    evidencia; NO habilita publicar, porque los pasos que publican
      #    (más abajo) NO llevan `always()`.
      - name: Extraer reporte de coverage
        if: always()
        run: |
          docker buildx build \
            --target coverage-export \
            --cache-from type=gha,scope=backend \
            --output type=local,dest=./coverage-backend \
            ./backend

      - name: Publicar resumen de coverage backend en el run
        if: always()
        run: |
          SUM=./coverage-backend/coverage-summary.json
          if [ -f "$SUM" ]; then
            echo "### 📊 Backend coverage" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% (\(.value.covered)/\(.value.total)) |"' "$SUM" | \
              (echo "| Métrica | % |"; echo "|---|---|"; cat) >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publicar reporte HTML descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage-backend/
          if-no-files-found: warn

      # 3. ENTRAR AL REGISTRY — sólo en push (los PRs no publican). El
      #    GITHUB_TOKEN vive lo que dura el job: no hay ningún secret nuevo.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. ÚLTIMO PASO — construye la imagen final y la publica con la
      #    etiqueta del commit. Sólo publica en push a main; en PR construye
      #    igual (segunda verificación) pero no sube nada.
      #    Nombre en MINÚSCULAS porque ghcr.io no acepta mayúsculas
      #    (github.repository trae "LorenzoGalaverna/…" con L y G altas).
      # cache-from sin cache-to: reutiliza lo que dejó el step de tests, pero
      # NO reescribe (así los 2 steps del job no compiten por el mismo slot,
      # que da "error writing layer blob: not_found" con el cache de gha).
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/lorenzogalaverna/ingsoft3-ucc-2026-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Correr tests con coverage (etapa `test`)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          push: false
          tags: habit-tracker-frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Extraer reporte de coverage
        if: always()
        run: |
          docker buildx build \
            --target coverage-export \
            --cache-from type=gha,scope=frontend \
            --output type=local,dest=./coverage-frontend \
            ./frontend

      - name: Publicar resumen de coverage frontend en el run
        if: always()
        run: |
          SUM=./coverage-frontend/coverage-summary.json
          if [ -f "$SUM" ]; then
            echo "### 📊 Frontend coverage" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% (\(.value.covered)/\(.value.total)) |"' "$SUM" | \
              (echo "| Métrica | % |"; echo "|---|---|"; cat) >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publicar reporte HTML descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage-frontend/
          if-no-files-found: warn

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cache-from sin cache-to (mismo motivo que backend, ver más arriba)
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/lorenzogalaverna/ingsoft3-ucc-2026-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend

  # ────────────────────────────────────────────────────────────────────────
  # TP6 §3.3 — Deploy automático a QA disparado por el pipeline
  # `needs:` + `if:` implementan la cadena con compuertas: sin CI verde no
  # hay deploy, y sólo los push a main (no los PRs) despliegan.
  # `environment: qa` conecta el job al environment: hereda sus secrets
  # (los deploy hooks) y suma al historial de Deployments. Sin reglas de
  # protección: es automático a propósito. Prod SÍ tiene gate (§3.4).
  # ────────────────────────────────────────────────────────────────────────
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    steps:
      # TP7 §3.2 — Desplegar la IMAGEN del commit, no reconstruir.
      # El hook image-backed de Render acepta &imgURL=<URL de la imagen>,
      # que le dice QUÉ imagen ejecutar. Se saca el &ref= del TP6: con una
      # imagen no hay nada que construir, y dejarlo haría creer a quien lea
      # el YAML que el proveedor todavía compila.
      # --get + --data-urlencode arma la URL correcta: agrega el parámetro
      # con '&' (el hook ya trae ?key=…) y codifica los ':' y '/' del valor.
      # La URL del hook va ÚLTIMA porque --data-urlencode se lleva el valor
      # que tiene al lado y la URL es el único argumento suelto.
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/lorenzogalaverna/ingsoft3-ucc-2026-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/lorenzogalaverna/ingsoft3-ucc-2026-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API"   "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      # Smoke con reintentos: el free tier de Render tiene cold start
      # (~1 min) y buildea en background — un curl seco daría falsos rojos.
      # Verificamos las 3 capas: /health (proceso vivo), /api/habits
      # (la BD responde — un /health solo puede dar verde con la BD rota),
      # y / del front (nginx sirviendo dist/).
      # --max-time va en CADA curl, no en el shell: un servicio despertando
      # acepta la conexión y no contesta; sin tope, curl queda esperando
      # hasta que el job muera por el límite del runner.
      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://miapp-api-qa.onrender.com
          URL_FRONT: https://miapp-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/habits" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde (API + BD + front)"; exit 0
            fi
            echo "  intento $i/30: aún no responde — espera 20s"
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  # ────────────────────────────────────────────────────────────────────────
  # TP6 §3.4 — Deploy a PROD detrás del gate humano
  # needs: deploy-qa → PROD solo después de que QA quedó verde.
  # environment: production → el workflow SE PAUSA acá hasta que el
  # required reviewer (yo mismo) apruebe. Si el reviewer rechaza, el job
  # queda como failure y a PROD no sube nada.
  # No repito el `if: main only` — la cadena por needs ya lo garantiza:
  # deploy-qa tiene el if, y deploy-prod depende de él.
  # concurrency: si mientras uno espera aprobación llega otro merge, evita
  # que 2 deploys a prod se pisen. Ojo con la trampa documentada de §3.4:
  # aprobar una corrida vieja después de una nueva puede hacer retroceder
  # PROD — se maneja rechazando la vieja a mano.
  # ────────────────────────────────────────────────────────────────────────
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # TP7 §3.2 — PROD recibe la MISMA imagen que QA verificó: el mismo
      # IMG con el mismo sha-<commit>. Más crítico aún que en QA: entre
      # "waiting for review" y el approve pueden pasar horas y main puede
      # moverse. Sin fijar la imagen al commit de ESTA corrida, se
      # desplegaría lo último que haya.
      - name: Desplegar en PROD la IMAGEN aprobada (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/lorenzogalaverna/ingsoft3-ucc-2026-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/lorenzogalaverna/ingsoft3-ucc-2026-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API"   "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://miapp-api-prod.onrender.com
          URL_FRONT: https://miapp-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/habits" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde (API + BD + front)"; exit 0
            fi
            echo "  intento $i/30: aún no responde — espera 20s"
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
