# CI — construye backend y frontend con sus Dockerfiles del TP2 + corre la suite
# de tests y mide coverage en el TP5. La etapa `test` de cada Dockerfile falla
# entera si el umbral no se cumple → el docker build falla → el job se pone rojo
# → el gate del TP4 bloquea el merge.
name: CI

on:
  pull_request:
    branches: [main]      # el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # deja constancia post-merge y siembra el cache para futuros PRs

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del backend (incluye la etapa `test`)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false                    # todavía no publicamos: sólo verificamos
          tags: habit-tracker-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Etapa `coverage-export` del Dockerfile: solo la carpeta /coverage.
      # `--output type=local,dest=X` escribe X en el runner, listo para artefacto.
      - name: Extraer reporte de coverage
        if: always()
        run: |
          docker buildx build \
            --target coverage-export \
            --cache-from type=gha,scope=backend \
            --output type=local,dest=./coverage-backend \
            ./backend

      - name: Publicar resumen de coverage backend en el run
        if: always()
        run: |
          SUM=./coverage-backend/coverage-summary.json
          if [ -f "$SUM" ]; then
            echo "### 📊 Backend coverage" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% (\(.value.covered)/\(.value.total)) |"' "$SUM" | \
              (echo "| Métrica | % |"; echo "|---|---|"; cat) >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publicar reporte HTML descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage-backend/
          if-no-files-found: warn

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del frontend (incluye la etapa `test`)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: habit-tracker-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Extraer reporte de coverage
        if: always()
        run: |
          docker buildx build \
            --target coverage-export \
            --cache-from type=gha,scope=frontend \
            --output type=local,dest=./coverage-frontend \
            ./frontend

      - name: Publicar resumen de coverage frontend en el run
        if: always()
        run: |
          SUM=./coverage-frontend/coverage-summary.json
          if [ -f "$SUM" ]; then
            echo "### 📊 Frontend coverage" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% (\(.value.covered)/\(.value.total)) |"' "$SUM" | \
              (echo "| Métrica | % |"; echo "|---|---|"; cat) >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publicar reporte HTML descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage-frontend/
          if-no-files-found: warn
